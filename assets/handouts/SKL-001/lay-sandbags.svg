<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 185" role="img" aria-labelledby="title description">
  <title id="title">Overlap sandbags and stagger layers</title>
  <desc id="description">A top view shows three overlapping bags with their folded tails beneath the filled portions and facing incoming water. A section view shows two bags forming a wide base with one bag centered over their joint.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1 1l7 3.5L1 8" fill="none" stroke="#111" stroke-width="1.5"/>
    </marker>
  </defs>

  <g fill="#fff" stroke="#111" stroke-linejoin="round">
    <rect x="2" y="2" width="322" height="181" rx="3" stroke-width="1.7"/>
    <rect x="336" y="2" width="322" height="181" rx="3" stroke-width="1.7"/>
  </g>

  <!-- Top view: water, fold orientation, and repeating overlap. -->
  <g fill="none" stroke="#111" stroke-linecap="round">
    <path d="M20 75h48M20 90h48M20 105h48" stroke-width="1.8" marker-end="url(#arrow)"/>
    <path d="M82 93h25" stroke-width="1.4" marker-end="url(#arrow)"/>
  </g>
  <g stroke="#111" stroke-width="2" stroke-linejoin="round">
    <path d="M102 69h62q16 0 22 24-6 24-22 24h-62q-14-3-14-24t14-24z" fill="#fff"/>
    <path d="M155 69h65q16 0 22 24-6 24-22 24h-65q-14-3-14-24t14-24z" fill="#fff"/>
    <path d="M211 69h65q16 0 22 24-6 24-22 24h-65q-14-3-14-24t14-24z" fill="#fff"/>
    <path d="M102 72q-9 21 0 42M155 72q-9 21 0 42M211 72q-9 21 0 42" fill="#f4f4f4" stroke-dasharray="4 3"/>
    <path d="M170 82q6 11 0 22M226 82q6 11 0 22" fill="none" stroke-width="1" opacity=".65"/>
  </g>

  <!-- Section view: broad base and joint covered by upper course. -->
  <path d="M357 139h280" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round"/>
  <g fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round">
    <path d="M371 111q6-17 25-19h78q18 2 24 19v27H371z"/>
    <path d="M496 111q6-17 25-19h77q18 2 24 19v27H496z"/>
    <path d="M433 63q6-17 25-20h78q19 3 25 20v27H433z"/>
    <path d="M497 138V94" fill="none" stroke-dasharray="4 3"/>
  </g>
  <path d="M448 76q49 8 98 0M387 124q48 8 96 0M512 124q48 8 96 0" fill="none" stroke="#111" stroke-width="1" stroke-dasharray="3 4" opacity=".55"/>

  <g fill="#111" font-family="Arial, sans-serif">
    <text x="16" y="24" font-size="13" font-weight="700">TOP VIEW · OVERLAP</text>
    <text x="350" y="24" font-size="13" font-weight="700">SIDE VIEW · STAGGER</text>
    <g font-size="11">
      <text x="18" y="131" font-weight="700">INCOMING</text><text x="18" y="143" font-weight="700">WATER</text>
      <text x="114" y="139">folds underneath</text>
      <path d="M156 135l-34-16" fill="none" stroke="#111" stroke-width="1"/>
      <text x="404" y="160">wide base</text>
      <text x="533" y="160">joint covered</text>
      <path d="M568 155l-65-15" fill="none" stroke="#111" stroke-width="1"/>
    </g>
  </g>
</svg>
