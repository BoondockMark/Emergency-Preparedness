<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 186" role="img" aria-labelledby="title description">
<title id="title">5. Blocking drainage</title><desc id="description">Wrong: a sandbag blocks a drain grate. Right: the drain is clear, with a labeled runoff arrow entering it.</desc>
