<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 218" role="img" aria-labelledby="title description">
<title id="title">Stagger each course by about half a bag.</title><desc id="description">Three courses of bags have offset joints; the joints of the middle course cover the centers of the bags below.</desc>
