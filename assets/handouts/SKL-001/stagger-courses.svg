<marker id="dim" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse"><path d="M7 0L0 3.5L7 7" fill="none" stroke="#16232b"/></marker>
<pattern id="sand" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".8" fill="#16232b"/><circle cx="8" cy="9" r=".8" fill="#16232b"/></pattern>
<g id="bag"><path d="M5 13Q13 1 29 5Q67 -2 96 8Q110 13 109 30L106 47Q93 54 60 50L10 51Q0 37 5 13Z" fill="white" stroke="#16232b" stroke-width="2"/><path d="M9 17Q15 29 10 45M96 11Q91 24 101 44M19 46Q55 41 93 46M17 10Q60 16 91 10" fill="none" stroke="#16232b" stroke-width="1"/></g>
<g id="sidebag"><path d="M2 35Q7 10 29 7Q58 0 92 9Q109 16 110 35Q57 43 2 35Z" fill="white" stroke="#16232b" stroke-width="2"/><path d="M11 32Q56 27 101 33M17 13L14 28M96 15L100 30" fill="none" stroke="#16232b" stroke-width="1"/></g>
<g id="plant"><path d="M0 30Q-3 8 -18 0Q-15 21 -3 31M0 31Q1 9 17 1Q15 20 2 31M0 31Q-2 1 0 -12Q5 11 0 31M-3 29Q-25 14 -25 27L-3 33M3 29Q25 17 26 28L3 33" fill="white" stroke="#16232b" stroke-width="1.4"/></g>
</defs>
<g font-family="DejaVu Sans, sans-serif" fill="#16232b" stroke-linecap="round" stroke-linejoin="round"><text x="165" y="22" font-size="15" font-weight="700" text-anchor="middle">Front view — offset joints</text><use href="#sidebag" transform="translate(12 132) scale(0.92 1)"/><use href="#sidebag" transform="translate(118 132) scale(0.92 1)"/><use href="#sidebag" transform="translate(224 132) scale(0.92 1)"/><use href="#sidebag" transform="translate(64 92) scale(0.92 1)"/><use href="#sidebag" transform="translate(170 92) scale(0.92 1)"/><use href="#sidebag" transform="translate(118 52) scale(0.92 1)"/><path d="M20 174L320 174" fill="none" stroke="#16232b" stroke-width="1.5" /><path d="M114 42L114 88" fill="none" stroke="#16232b" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M167 42L167 88" fill="none" stroke="#16232b" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M117 48L164 48" fill="none" stroke="#16232b" stroke-width="1.5" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="165" y="201" font-size="14" font-weight="400" text-anchor="middle">About half a bag</text></g>
</svg>
