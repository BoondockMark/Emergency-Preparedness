<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 203" role="img" aria-labelledby="title description">
<title id="title">Water seeping through the barrier.</title><desc id="description">Labeled arrows pass through joints and underneath the sandbag barrier, showing that bags are not watertight.</desc>
<defs>
<marker id="flow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#0063a6"/></marker>
<marker id="dim" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse"><path d="M7 0L0 3.5L7 7" fill="none" stroke="#16232b"/></marker>
<pattern id="sand" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".8" fill="#16232b"/><circle cx="8" cy="9" r=".8" fill="#16232b"/></pattern>
<g id="bag"><path d="M5 13Q13 1 29 5Q67 -2 96 8Q110 13 109 30L106 47Q93 54 60 50L10 51Q0 37 5 13Z" fill="white" stroke="#16232b" stroke-width="2"/><path d="M9 17Q15 29 10 45M96 11Q91 24 101 44M19 46Q55 41 93 46M17 10Q60 16 91 10" fill="none" stroke="#16232b" stroke-width="1"/></g>
<g id="sidebag"><path d="M2 35Q7 10 29 7Q58 0 92 9Q109 16 110 35Q57 43 2 35Z" fill="white" stroke="#16232b" stroke-width="2"/><path d="M11 32Q56 27 101 33M17 13L14 28M96 15L100 30" fill="none" stroke="#16232b" stroke-width="1"/></g>
<g id="plant"><path d="M0 30Q-3 8 -18 0Q-15 21 -3 31M0 31Q1 9 17 1Q15 20 2 31M0 31Q-2 1 0 -12Q5 11 0 31M-3 29Q-25 14 -25 27L-3 33M3 29Q25 17 26 28L3 33" fill="white" stroke="#16232b" stroke-width="1.4"/></g>
</defs>
<g font-family="DejaVu Sans, sans-serif" fill="#16232b" stroke-linecap="round" stroke-linejoin="round"><use href="#bag" transform="translate(130 102) scale(1 0.8)"/><use href="#bag" transform="translate(241 98) scale(1 0.8)"/><use href="#bag" transform="translate(352 91) scale(1 0.8)"/><use href="#bag" transform="translate(185 66) scale(1 0.8)"/><use href="#bag" transform="translate(296 61) scale(1 0.8)"/><path d="M15 79H117" fill="none" stroke="#0063a6" stroke-width="3" marker-end="url(#flow)"/><path d="M161 112L191 157" fill="none" stroke="#0063a6" stroke-width="3" marker-end="url(#flow)"/><path d="M265 111L285 157" fill="none" stroke="#0063a6" stroke-width="3" marker-end="url(#flow)"/><path d="M380 106L406 150" fill="none" stroke="#0063a6" stroke-width="3" marker-end="url(#flow)"/><path d="M10 158Q52 148 96 158T190 158T285 158T400 158" fill="none" stroke="#0063a6" stroke-width="1.2" /><text x="149" y="187" font-size="15" font-weight="700" text-anchor="start">Seepage through and under bags</text></g>
