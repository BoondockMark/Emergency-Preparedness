<svg xmlns="http://www.w3.org/2000/svg" width="816" height="1056" viewBox="0 0 612 792"><rect width="612" height="792" fill="white"/><rect x="12" y="34" width="21" height="724" fill="#a64618"/><text x="65" y="70" font-family="Arial" font-size="8" font-weight="bold" fill="#a64618">LA HABRA HEIGHTS FIRE WATCH · SKL-04 · DRAFT</text><text x="65" y="110" font-family="Arial" font-size="25" font-weight="bold" fill="#202b32">Sandbagging Basics — continued</text><g font-family="Arial" fill="#202b32"><text x="65" y="150" font-size="12">SAMPLE TEXT — NOT APPROVED ADVICE. Back page demonstrates checks, limits,</text><text x="65" y="168" font-size="12">local facts, and citations.</text><text x="65" y="186" font-size="12">Check the work</text><text x="65" y="204" font-size="12">Ground remains stable</text><text x="65" y="222" font-size="12">Bags remain flat</text><text x="65" y="240" font-size="12">Seams are staggered</text><text x="65" y="258" font-size="12">Exit route remains open</text><text x="65" y="276" font-size="12">DIAGRAM PLACEHOLDER</text><text x="65" y="294" font-size="12">top view</text><text x="65" y="312" font-size="12">Reassess conditions</text><text x="65" y="330" font-size="12">Observe from a safe position.</text><text x="65" y="348" font-size="12">Stop if water rises or the installation shifts.</text><text x="65" y="366" font-size="12">Leave before the escape route is threatened.</text><text x="65" y="384" font-size="12">This handout is not a substitute for directions from emergency personnel.</text><text x="65" y="402" font-size="12">Exact stop-work criteria require subject-matter review.</text><text x="65" y="420" font-size="12">Local supply information: [VERIFY]</text><text x="65" y="438" font-size="12">Official flood updates: [VERIFY]</text><text x="65" y="456" font-size="12">Sources and review</text><text x="65" y="474" font-size="12">PLACEHOLDER: Cite reviewed public-works or flood-control guidance, URL,</text><text x="65" y="492" font-size="12">publication date, and access date. Record editor and subject-matter reviewer</text><text x="65" y="510" font-size="12">in metadata.</text></g><line x1="65" y1="750" x2="560" y2="750" stroke="#aeb8bd"/><text x="65" y="770" font-family="Arial" font-size="8">SKL-04 · Reviewed 2026-09-24 · 2 of 2</text></svg>